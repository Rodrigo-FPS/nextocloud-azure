#contrasena inyectada via Docker secret al arrancar el contenedor

#persistencia AOF escribe cada segundo
appendonly yes
appendfsync everysec

#limite de memoria y politica de expulsion cuando se alcanza
maxmemory 256mb
maxmemory-policy allkeys-lru

#rechaza conexiones sin autenticacion
protected-mode yes

#escucha en todas las interfaces
bind 0.0.0.0

#nivel de logging
loglevel notice
